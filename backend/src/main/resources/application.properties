spring.application.name=guru-studio-backend

# Port: Render sets PORT automatically. Locally it defaults to 8080.
server.port=${PORT:8080}

# ---- Database (MySQL) ----
# DB_URL has a local default. DB_USERNAME and DB_PASSWORD have NO default,
# so the app will refuse to start if you forget them (this is intentional).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gurustudio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update = create missing tables/columns, keep existing data.
# Never change this to create or create-drop: those erase your data on every start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Security ----
# JWT_SECRET has NO default. It must be a random string of at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- Admin login ----
# Both values are read from environment variables. Empty here means "not set yet".
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Cloudinary (photo storage) ----
# Empty until you set the CLOUDINARY_* environment variables. The app still starts without them.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---- CORS ----
# The React frontend address. http://localhost:5173 is always allowed as well.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
